
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>밤의 황금</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@300;400;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
 
<style>
*{box-sizing:border-box;margin:0;padding:0;}
 
body{
  background:url('bg_1.png') center center / cover no-repeat fixed;
  color:#ccc;
  font-family:'Noto Sans KR',sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  transition:background 1.2s ease;
}
 
/* ── 표지 ── */
#cover{
  position:fixed; inset:0; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:500; cursor:pointer; user-select:none;
}
#cover-student{
  font-size:11px; font-weight:300; color:rgba(255,255,255,0.38);
  letter-spacing:4px; margin-bottom:16px; opacity:0;
  animation:coverFadeIn 1.0s ease 0.1s forwards;
}
#cover-title{
  font-family:'Cinzel',serif; font-size:clamp(40px,8vw,76px); font-weight:800;
  color:#fff; letter-spacing:10px; text-align:center; opacity:0;
  transform:translateY(-16px); animation:coverFadeIn 1.4s ease 0.3s forwards;
}
#cover-subtitle{
  font-size:clamp(12px,2vw,16px); font-weight:300;
  color:rgba(255,255,255,0.38); letter-spacing:5px; margin-top:26px; opacity:0;
  animation:coverFadeIn 1.2s ease 1.1s forwards, blink 2s ease-in-out 2.2s infinite;
}
@keyframes coverFadeIn{ to{opacity:1;transform:translateY(0);} }
@keyframes blink{ 0%,100%{opacity:0.38;} 50%{opacity:0.12;} }
#cover.hiding{ animation:coverFadeOut 0.9s ease forwards; }
@keyframes coverFadeOut{ to{opacity:0;pointer-events:none;} }
 
/* ── 게임 래퍼 ── */
#game-wrapper{
  width:100%; display:flex; flex-direction:column; align-items:center;
  flex:1; opacity:0; transition:opacity 0.8s ease 0.5s; pointer-events:none;
}
#game-wrapper.visible{ opacity:1; pointer-events:auto; }
 
#dark-overlay{ position:fixed; inset:0; pointer-events:none; background:rgba(0,0,0,0.60); z-index:0; }
#corruption-overlay{
  position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(140,0,0,0) 0%,rgba(80,0,0,0) 100%);
  transition:background 1.4s ease,opacity 1.4s ease; z-index:0; opacity:0;
}
 
/* ══════════════════════════════
   씬 전환 화면
══════════════════════════════ */
#transition-screen{
  position:fixed; inset:0; z-index:300;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:24px;
  opacity:0; pointer-events:none;
  transition:opacity 0.55s ease;
}
#transition-screen.active{ opacity:1; pointer-events:auto; }
 
#tr-narration, #tr-desc{
  width:min(680px,88vw);
  opacity:0; transform:translateY(12px);
  transition:opacity 0.5s ease, transform 0.5s ease;
}
#tr-narration.show, #tr-desc.show{ opacity:1; transform:translateY(0); }
 
#tr-next{
  margin-top:14px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.16);
  color:rgba(255,255,255,0.40);
  font-family:'Noto Sans KR',sans-serif;
  font-size:10px; letter-spacing:4px;
  padding:7px 26px; cursor:pointer;
  transition:border-color 0.2s, color 0.2s, opacity 0.4s;
  opacity:0; pointer-events:none;
  border-radius:2px;
  width:auto; min-height:unset; text-align:center;
}
#tr-next::before{ content:none; }
#tr-next.show{ opacity:1; pointer-events:auto; }
#tr-next:hover{ border-color:rgba(255,255,255,0.36); color:rgba(255,255,255,0.70); transform:none; box-shadow:none; background:transparent; }
 
/* ── 다시 시작하기 버튼 ── */
#restart-btn{
  position:fixed; right:28px; bottom:28px; z-index:500;
  background:transparent;
  border:1px solid rgba(255,255,255,0.16);
  color:rgba(255,255,255,0.40);
  font-family:'Noto Sans KR',sans-serif;
  font-size:10px; letter-spacing:4px;
  padding:7px 26px; cursor:pointer;
  transition:border-color 0.2s, color 0.2s, opacity 0.6s;
  opacity:0; pointer-events:none;
  border-radius:2px;
  width:auto; min-height:unset;
}
#restart-btn::before{ content:none; }
#restart-btn.show{ opacity:1; pointer-events:auto; }
#restart-btn:hover{ border-color:rgba(255,255,255,0.36); color:rgba(255,255,255,0.70); transform:none; box-shadow:none; background:transparent; }
#restart-btn.salvation{
  border-color:rgba(80,70,60,0.35);
  color:rgba(70,60,50,0.65);
}
#restart-btn.salvation:hover{ border-color:rgba(60,50,40,0.55); color:rgba(50,40,30,0.85); background:transparent; }
 
/* ══════════════════════════════
   구원 엔딩 — 빛이 스며드는 효과
══════════════════════════════ */
#salvation-overlay{
  position:fixed; inset:0; opacity:0; pointer-events:none; z-index:400;
  background:#fff;
  transition:opacity 2.5s ease;
}
/* 빛 입자 캔버스 */
#salvation-canvas{
  position:fixed; inset:0; z-index:401; opacity:0; pointer-events:none;
  transition:opacity 1.2s ease 1s;
}
#salvation-text{
  position:fixed; inset:0; display:flex; flex-direction:column;
  justify-content:center; align-items:center; z-index:402;
  opacity:0; pointer-events:none; gap:18px;
}
#salvation-text h2{
  font-family:'Cinzel',serif; font-size:44px; letter-spacing:8px; color:#2a2a2a;
  margin:0;
  /* 잉크 물드는 효과 */
  clip-path: inset(0 100% 0 0);
  transition: clip-path 2.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s;
}
#salvation-text h2.inked{ clip-path: inset(0 0% 0 0); }
#salvation-text p{
  font-size:15px; color:#888; letter-spacing:3px; font-weight:300;
  opacity:0;
  transform:translateY(8px);
  transition: opacity 1.4s ease 1.8s, transform 1.4s ease 1.8s;
}
#salvation-text p.inked{ opacity:1; transform:translateY(0); }
 
/* 구원 엔딩 금빛 물결 */
#salvation-ripple{
  position:fixed; inset:0; z-index:400; pointer-events:none; opacity:0;
}
@keyframes salvationRipple{
  0%  { transform:scale(0); opacity:0.7; }
  100%{ transform:scale(4); opacity:0;   }
}
.salvation-ring{
  position:absolute; border-radius:50%;
  border:1px solid rgba(220,180,80,0.5);
  animation:salvationRipple 3s ease-out forwards;
}
 
/* ══════════════════════════════
   붕괴 엔딩 — 어둠이 번지는 효과
══════════════════════════════ */
#collapse-overlay{
  position:fixed; inset:0; opacity:0; pointer-events:none; z-index:400;
  background:radial-gradient(ellipse at 50% 50%, #2a0000 0%, #0a0000 60%, #000 100%);
  transition:opacity 3s ease;
}
#collapse-text{
  position:fixed; inset:0; display:flex; flex-direction:column;
  justify-content:center; align-items:center; z-index:401;
  opacity:0; pointer-events:none; gap:12px;
}
#collapse-text h2{
  font-family:'Cinzel',serif; font-size:46px; letter-spacing:8px;
  color:#d0a898; text-shadow:0 0 22px rgba(120,24,24,0.5); margin:0;
  /* 아래에서 스며오르는 효과 */
  clip-path: inset(0 0 100% 0);
  transition: clip-path 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s,
              text-shadow 2s ease 1.5s;
}
#collapse-text h2.inked{
  clip-path: inset(0 0 0% 0);
  text-shadow:0 0 40px rgba(180,40,20,0.7), 0 0 80px rgba(120,0,0,0.4);
}
#collapse-text p{
  font-size:14px; color:rgba(200,140,120,0.55); letter-spacing:4px; font-weight:300;
  opacity:0;
  transition: opacity 1.8s ease 2.5s;
}
#collapse-text p.inked{ opacity:1; }
 
/* 붕괴 엔딩 균열 효과 */
#collapse-cracks{
  position:fixed; inset:0; z-index:401; pointer-events:none;
  opacity:0; transition:opacity 1s ease 1s;
}
.crack-line{
  position:absolute; background:rgba(180,30,10,0.25);
  transform-origin:top left;
  animation:crackGrow 1.5s ease-out forwards;
}
@keyframes crackGrow{
  from{ transform:scaleX(0); opacity:0; }
  to  { transform:scaleX(1); opacity:1; }
}
 
/* ══════════════════════════════
   기타 엔딩 텍스트 물드는 공통 효과
══════════════════════════════ */
.ending-reveal{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:28px 32px;
  text-align:center;
}
.ending-icon{
  font-size:40px; opacity:0;
}
.ending-icon.pop{
  animation: iconPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes iconPop{
  from{ transform:scale(0.3) rotate(-15deg); opacity:0; }
  to  { transform:scale(1) rotate(0deg);     opacity:1; }
}
.ending-title{
  font-family:'Cinzel',serif; font-size:26px; letter-spacing:6px;
  position:relative; overflow:hidden;
  /* 기본 색 (중립) */
  color:#ccc;
}
/* 타락 우세: 붉은 계열 */
.ending-title.taint{ color:#c07060; text-shadow:0 0 18px rgba(160,40,20,0.35); }
/* 영혼 우세: 밝은 흰 계열 */
.ending-title.pure { color:#e8e4f0; text-shadow:0 0 18px rgba(200,190,255,0.30); }
 
/* 잉크 물드는 핵심: clip-path로 왼쪽→오른쪽 스윕 */
.ink-wipe{
  display:inline-block;
  clip-path:inset(0 100% 0 0);
}
.ink-wipe.run{
  animation: inkWipe 1.8s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes inkWipe{
  from{ clip-path:inset(0 100% 0 0); }
  to  { clip-path:inset(0 0% 0 0);   }
}
 
/* 타락 물듦: 붉게 번지며 등장 */
.ink-wipe.run.taint{
  animation: inkWipeTaint 1.8s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes inkWipeTaint{
  0%  { clip-path:inset(0 100% 0 0); filter:brightness(3) sepia(1) hue-rotate(-30deg); }
  40% { filter:brightness(2) sepia(0.8) hue-rotate(-20deg); }
  100%{ clip-path:inset(0 0% 0 0);   filter:brightness(1) sepia(0) hue-rotate(0deg); }
}
 
/* 영혼 물듦: 하얗게 번지며 등장 */
.ink-wipe.run.pure{
  animation: inkWipePure 1.8s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes inkWipePure{
  0%  { clip-path:inset(0 100% 0 0); filter:brightness(4) saturate(0); }
  50% { filter:brightness(2.2) saturate(0.2); }
  100%{ clip-path:inset(0 0% 0 0);   filter:brightness(1) saturate(1); }
}
 
.ending-sub{
  font-size:12px; letter-spacing:3px; color:rgba(180,170,155,0.6);
  opacity:0; transform:translateY(6px);
}
.ending-sub.rise{
  animation: subRise 1.2s ease forwards;
}
@keyframes subRise{
  from{ opacity:0; transform:translateY(6px); }
  to  { opacity:1; transform:translateY(0); }
}
 
/* ── 상태창 ── */
#status-bar{
  position:relative; z-index:10; width:100%; max-width:780px;
  display:flex; gap:10px; padding:12px 18px 8px;
}
.stat-card{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:rgba(18,18,18,0.75); border:1px solid #242424; border-radius:8px;
  padding:8px 6px 7px; transition:border-color .8s,background .8s;
}
.stat-label{ font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#404040; font-weight:600; }
.stat-value{ font-family:'Cinzel',serif; font-size:19px; font-weight:800; line-height:1; transition:color .8s; }
.stat-wealth .stat-value{color:#907028;} .stat-wealth .stat-label{color:#503c14;} .stat-wealth{border-color:#281c08;}
.stat-corruption .stat-value{color:#802818;} .stat-corruption .stat-label{color:#441010;} .stat-corruption{border-color:#280606;}
.stat-soul .stat-value{color:#306880;} .stat-soul .stat-label{color:#183848;} .stat-soul{border-color:#061820;}
.stat-bar-wrap{ width:100%; height:3px; background:rgba(255,255,255,0.05); border-radius:2px; overflow:hidden; }
.stat-bar-fill{ height:100%; border-radius:2px; transition:width .9s ease; }
.stat-wealth .stat-bar-fill{background:linear-gradient(90deg,#50300a,#a87830);}
.stat-corruption .stat-bar-fill{background:linear-gradient(90deg,#380,#802818);}
.stat-soul .stat-bar-fill{background:linear-gradient(90deg,#062438,#306880);}
 
h1{ font-family:'Cinzel',serif; font-size:30px; letter-spacing:6px; color:#aaa; text-shadow:0 0 8px rgba(255,255,255,.08); padding:7px 0 4px; position:relative; z-index:1; }
 
/* ── 씬 영역 ── */
#container{ width:100%; max-width:780px; flex:1; display:flex; flex-direction:column; justify-content:flex-end; position:relative; z-index:1; }
#scene{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; overflow-y:auto; transition:opacity .25s; }
 
.bubble{ display:flex; flex-direction:column; gap:0; position:relative; font-size:12.5px; line-height:1.78; }
 
.speaker-label{
  display:inline-block; font-size:8.5px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase;
  padding:2px 11px 2px 9px; position:relative; z-index:2;
  clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 100%, 0 100%);
  margin-bottom:-1px;
}
.bubble-text{
  padding:9px 14px 11px 13px; position:relative; z-index:1;
  font-family:'Noto Serif KR','Noto Sans KR',serif;
}
 
.narration{ background:none; border:none; box-shadow:none; }
.narration .speaker-label{ display:none; }
.narration .bubble-text{
  background:none; border:none; box-shadow:none;
  color:rgba(255,255,255,0.88);
  font-style:italic; font-size:14px; line-height:2.0;
  text-align:center; letter-spacing:0.5px; padding:0 8px;
  text-shadow:0 0 18px rgba(255,255,255,0.12);
}
.narration .bubble-text::before{ display:none; }
.narration .bubble-text::after{ display:none; }
 
.desc{ background:none; border:none; }
.desc .speaker-label{ display:none; }
.desc .bubble-text{
  background:none; border:none; box-shadow:none;
  color:rgba(180,165,145,0.70); font-style:italic;
  font-size:11.5px; line-height:1.75; text-align:center; padding:4px 8px; position:relative;
}
.desc .bubble-text::before{
  content:'──────'; display:block; color:rgba(140,120,90,0.40);
  font-style:normal; letter-spacing:2px; font-size:10px; margin-bottom:6px;
}
.desc .bubble-text::after{
  content:'──────'; display:block; color:rgba(140,120,90,0.40);
  font-style:normal; letter-spacing:2px; font-size:10px; margin-top:6px;
  position:static; width:auto; height:auto; border:none; pointer-events:none;
}
 
.npc .speaker-label{ background:rgba(20,5,5,0.70); color:#703020; border-top:1px solid #500e0e; border-left:1px solid #500e0e; }
.npc .bubble-text{ background:rgba(18,4,4,0.70); border:1px solid #440c0c; border-top:2px solid #703020; box-shadow:3px 3px 0 rgba(0,0,0,0.32); color:#c8b8b8; text-shadow:0 1px 4px rgba(100,0,0,0.08); }
.npc .bubble-text::after{ content:''; position:absolute; right:0; bottom:0; width:16px; height:16px; border-bottom:1px solid #500e0e; border-right:1px solid #500e0e; pointer-events:none; }
.npc .bubble-text::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:linear-gradient(180deg,#703020,#350808); pointer-events:none; }
 
.player .speaker-label{ background:rgba(4,5,16,0.70); color:#304880; border-top:1px solid #182050; border-left:1px solid #182050; }
.player .bubble-text{ background:rgba(4,5,16,0.70); border:1px solid #101830; border-top:2px solid #304880; box-shadow:3px 3px 0 rgba(0,0,0,0.32); color:#b8c8e0; text-shadow:0 1px 4px rgba(30,55,130,0.08); }
.player .bubble-text::after{ content:''; position:absolute; right:0; bottom:0; width:16px; height:16px; border-bottom:1px solid #182050; border-right:1px solid #182050; pointer-events:none; }
.player .bubble-text::before{ content:''; position:absolute; right:0; top:0; bottom:0; width:2px; background:linear-gradient(180deg,#304880,#060e22); pointer-events:none; }
 
/* ── 선택지 ── */
#choices{ width:100%; display:flex; justify-content:center; gap:10px; margin-bottom:12px; }
button{
  width:280px; min-height:66px; padding:10px 13px;
  background:rgba(10,10,10,0.78); color:#bbb; border:1px solid #242424;
  border-radius:7px; cursor:pointer; font-size:12.5px;
  font-family:'Noto Sans KR',sans-serif; line-height:1.52;
  transition:.2s; text-align:left; position:relative;
}
button::before{ content:'▶'; font-size:8.5px; color:#404040; margin-right:6px; transition:.2s; }
button:hover{ background:rgba(20,20,20,0.86); border-color:#404040; transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,0.38); }
button:hover::before{ color:#888; }
button.shake{ animation:shake .25s; background:#140000; border-color:#440; }
@keyframes shake{
  0%{transform:translate(0,0);} 25%{transform:translate(-2px,2px);}
  50%{transform:translate(2px,-2px);} 75%{transform:translate(-2px,2px);}
  100%{transform:translate(0,0);}
}
.delta{ display:block; font-size:9.5px; color:#404040; margin-top:3px; padding-left:14px; }
 
@keyframes corruptPulse{
  0%{box-shadow:0 0 0px rgba(120,0,0,0);}
  50%{box-shadow:0 0 36px rgba(120,0,0,0.16);}
  100%{box-shadow:0 0 0px rgba(120,0,0,0);}
}
body.corrupt-high{ animation:corruptPulse 2.5s ease-in-out infinite; }

<body>
 
<!-- 표지 -->
<div id="cover">
  <div id="cover-student">25340030 심예은</div>
  <div id="cover-title">밤의 황금</div>
  <div id="cover-subtitle">아무 곳이나 눌러 시작</div>
</div>
 
<!-- 다시 시작하기 버튼 -->
<button id="restart-btn">↩ &nbsp;다시 시작</button>
 
<!-- 씬 전환 화면 -->
<div id="transition-screen">

<script>
/* ── 다시 시작하기 ── */
const restartBtn = document.getElementById('restart-btn');
restartBtn.addEventListener('click', ()=>{
  location.reload();
});
function showRestartBtn(delay=3200, salvation=false){
  setTimeout(()=>{
    if(salvation) restartBtn.classList.add('salvation');
    restartBtn.classList.add('show');
  }, delay);
}
 
/* ── 표지 전환 ── */
const cover = document.getElementById('cover');
const gameWrapper = document.getElementById('game-wrapper');
let gameStarted = false;
cover.addEventListener('click', startGame);
function startGame(){
  if(gameStarted) return; gameStarted = true;
  document.getElementById('bgm').play().catch(e => console.log(e));
  cover.classList.add('hiding');
  cover.addEventListener('animationend',()=>{cover.style.display='none';},{once:true});
  gameWrapper.classList.add('visible');
  updateUI(); scene1();
}
 
/* ── 상태 ── */
let state={Wealth:0,Corruption:0,SoulPurity:50,Loop:0,NodeDestroyed:false};
function rangeText(v){return `${Math.floor(v*0.6)}~${Math.floor(v*1.4)}`;}
function randomize(v){return v+v*(Math.random()*0.3+0.1)*(Math.random()<0.5?-1:1);}
function applyChange({wealth=0,corruption=0,soul=0}){
  state.Wealth+=randomize(wealth);
  const prev=state.Corruption; state.Corruption+=randomize(corruption);
  const rise=state.Corruption-prev;
  if(rise>0) state.SoulPurity=Math.max(0,state.SoulPurity-rise);
  const sg=soul===0?0:Math.abs(randomize(soul))*Math.sign(soul);
  state.SoulPurity=Math.max(0,state.SoulPurity+sg);
  if(sg>0) state.Corruption=Math.max(0,state.Corruption-sg);
}
function updateCorruptionBG(){
  const r=Math.max(0,Math.min(100,state.Corruption))/100;
  const ov=document.getElementById('corruption-overlay');
  const ri=Math.floor(r*130);
  ov.style.background=`radial-gradient(ellipse at center,rgba(${ri},0,0,${r*.42}) 0%,rgba(55,0,0,${r*.60}) 100%)`;
  ov.style.opacity=r>0.05?'1':'0';
  document.body.classList.toggle('corrupt-high',r>=0.65);
  const card=document.querySelector('.stat-corruption');
  if(r>0.5){card.style.borderColor=`rgba(120,22,14,${r})`;card.style.background=`rgba(${Math.floor(r*24)},3,3,0.82)`;}
  else{card.style.borderColor='#280606';card.style.background='rgba(18,18,18,0.75)';}
}
function updateUI(){
  const w=Math.floor(state.Wealth),c=Math.floor(state.Corruption),s=Math.floor(state.SoulPurity);
  document.getElementById('val-wealth').textContent=w;
  document.getElementById('val-corruption').textContent=c;
  document.getElementById('val-soul').textContent=s;
  document.getElementById('bar-wealth').style.width=Math.min(100,Math.max(0,w))+'%';
  document.getElementById('bar-corruption').style.width=Math.min(100,Math.max(0,c))+'%';
  document.getElementById('bar-soul').style.width=Math.min(100,Math.max(0,s))+'%';
  updateCorruptionBG();
}
 
function bubble(type,name,html){
  return `<div class="bubble ${type}"><div class="speaker-label">${name}</div><div class="bubble-text">${html}</div></div>`;
}
 
/* ══════════════════════════════
   씬 렌더
══════════════════════════════ */
function renderScene(data){
  const ts=document.getElementById('transition-screen');
  const trN=document.getElementById('tr-narration');
  const trD=document.getElementById('tr-desc');
  const trBtn=document.getElementById('tr-next');
 
  trN.innerHTML=data.intro.narration
    ?`<div class="bubble narration"><div class="bubble-text">${data.intro.narration}</div></div>`:'';
  trD.innerHTML=data.intro.desc
    ?`<div class="bubble desc"><div class="bubble-text">${data.intro.desc}</div></div>`:'';
  trN.classList.remove('show'); trD.classList.remove('show'); trBtn.classList.remove('show');
 
  document.getElementById('scene').style.opacity='0';
  document.getElementById('choices').innerHTML='';
 
  ts.classList.add('active');
 
  if(data.intro.narration) setTimeout(()=>trN.classList.add('show'),380);
  const dDelay=data.intro.narration?860:380;
  if(data.intro.desc) setTimeout(()=>trD.classList.add('show'),dDelay);
  const bDelay=(data.intro.narration?860:0)+(data.intro.desc?560:0)+420;
  setTimeout(()=>trBtn.classList.add('show'),bDelay);
 
  trBtn.onclick=()=>{
    ts.classList.remove('active');
    setTimeout(()=>showDialogue(data),620);
  };
}
 
function showDialogue(data){
  const sceneDiv=document.getElementById('scene');
  sceneDiv.style.opacity='0';
  setTimeout(()=>{
    sceneDiv.innerHTML=data.dialogue||'';
    sceneDiv.style.transition='opacity 0.38s'; sceneDiv.style.opacity='1';
  },100);
  const choicesDiv=document.getElementById('choices');
  choicesDiv.innerHTML='';
  data.choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.innerHTML=`${c.text}<span class="delta">${c.delta()}</span>`;
    btn.onclick=()=>{
      btn.classList.add('shake');
      setTimeout(()=>{btn.classList.remove('shake');c.effect();updateUI();c.next();},150);
    };
    choicesDiv.appendChild(btn);
  });
}
 
/* ── 게임 화면 페이드 아웃 ── */
function fadeOutGame(){
  ['scene','choices'].forEach(id=>{const el=document.getElementById(id);el.style.transition='opacity 1.2s';el.style.opacity='0';});
  document.getElementById('status-bar').style.cssText+='transition:opacity 1.2s;opacity:0;';
  document.querySelector('h1').style.cssText+='transition:opacity 1.2s;opacity:0;';
  document.getElementById('corruption-overlay').style.cssText+='transition:opacity 1.5s;opacity:0;';
}
 
/* ══════════════════════════════
   구원 엔딩 — 빛이 물드는 효과
══════════════════════════════ */
function triggerSalvationEnding(){
  fadeOutGame();
 
  /* 1) 흰 오버레이 서서히 */
  setTimeout(()=>{
    document.getElementById('salvation-overlay').style.opacity='1';
  }, 600);
 
  /* 2) 파동 링 생성 */
  setTimeout(()=>{
    const ripple = document.getElementById('salvation-ripple');
    ripple.style.opacity='1';
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    const size = Math.max(window.innerWidth, window.innerHeight);
    [0, 600, 1200, 1900].forEach((delay, i)=>{
      setTimeout(()=>{
        const ring = document.createElement('div');
        ring.className='salvation-ring';
        const d = size * 0.35;
        ring.style.cssText=`left:${cx-d/2}px;top:${cy-d/2}px;width:${d}px;height:${d}px;animation-delay:0ms;opacity:0;`;
        ring.style.animation=`salvationRipple ${2.8+i*0.4}s ease-out forwards`;
        ripple.appendChild(ring);
      }, delay);
    });
  }, 900);
 
  /* 3) 빛 파티클 캔버스 */
  setTimeout(()=>{
    const canvas = document.getElementById('salvation-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.opacity='1';
    const ctx = canvas.getContext('2d');
    const particles = Array.from({length:60},()=>({
      x: window.innerWidth/2 + (Math.random()-0.5)*80,
      y: window.innerHeight/2 + (Math.random()-0.5)*80,
      vx: (Math.random()-0.5)*1.2,
      vy: -(Math.random()*1.8+0.6),
      size: Math.random()*3+1,
      alpha: Math.random()*0.6+0.4,
      life: 0, maxLife: 120+Math.floor(Math.random()*80)
    }));
    let frame=0;
    function animParticles(){
      if(frame>200) return;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.life++; p.x+=p.vx; p.y+=p.vy; p.vy*=0.99;
        const t=p.life/p.maxLife;
        const a=p.alpha*(t<0.3?t/0.3:1-((t-0.3)/0.7));
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*(1-t*0.5),0,Math.PI*2);
        ctx.fillStyle=`rgba(255,230,140,${a})`;
        ctx.fill();
        if(p.life>=p.maxLife){ p.life=0; p.x=window.innerWidth/2+(Math.random()-0.5)*80; p.y=window.innerHeight/2+(Math.random()-0.5)*80; }
      });
      frame++;
      requestAnimationFrame(animParticles);
    }
    animParticles();
  }, 1200);
 
  /* 4) 텍스트 잉크 물들듯 등장 */
  setTimeout(()=>{
    const t=document.getElementById('salvation-text');
    t.style.opacity='1'; t.style.pointerEvents='auto';
    setTimeout(()=>{ t.querySelector('h2').classList.add('inked'); }, 100);
    setTimeout(()=>{ t.querySelector('p').classList.add('inked'); }, 200);
  }, 1800);
  showRestartBtn(3800, true);
}
 
/* ══════════════════════════════
   붕괴 엔딩 — 어둠이 번지는 효과
══════════════════════════════ */
function triggerCollapseEnding(){
  fadeOutGame();
 
  /* 1) 어두운 오버레이 */
  setTimeout(()=>{
    const col=document.getElementById('collapse-overlay');
    col.style.opacity='1';
  }, 500);
 
  /* 2) 균열 라인 */
  setTimeout(()=>{
    const cracks=document.getElementById('collapse-cracks');
    cracks.style.opacity='1';
    const cx=window.innerWidth/2, cy=window.innerHeight/2;
    const crackDefs=[
      {x:cx,y:cy,w:220,h:1,rot:-18,delay:0},
      {x:cx-40,y:cy+20,w:180,h:1,rot:32,delay:200},
      {x:cx+20,y:cy-15,w:260,h:1,rot:-55,delay:380},
      {x:cx-60,y:cy-10,w:140,h:1,rot:70,delay:550},
      {x:cx+10,y:cy+30,w:190,h:1,rot:-8,delay:700},
    ];
    crackDefs.forEach(c=>{
      setTimeout(()=>{
        const el=document.createElement('div');
        el.className='crack-line';
        el.style.cssText=`left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h+1}px;transform:rotate(${c.rot}deg);animation-duration:${0.8+Math.random()*0.4}s;`;
        cracks.appendChild(el);
      }, c.delay);
    });
  }, 800);
 
  /* 3) 텍스트 — 아래서 스며오르듯 */
  setTimeout(()=>{
    const t=document.getElementById('collapse-text');
    t.style.opacity='1'; t.style.pointerEvents='auto';
    setTimeout(()=>{ t.querySelector('h2').classList.add('inked'); }, 100);
    setTimeout(()=>{ t.querySelector('p').classList.add('inked'); }, 200);
  }, 1800);
  showRestartBtn(3800);
}
 
/* ══════════════════════════════
   기타 엔딩 — 수치 기반 잉크 물드는 효과
   타락 우세 → 붉게, 영혼 우세 → 하얗게
══════════════════════════════ */
function showOtherEnding(label, icon){
  fadeOutGame();
  document.getElementById('transition-screen').classList.remove('active');
 
  const colorClass = state.Corruption > state.SoulPurity ? 'taint' : 'pure';
 
  setTimeout(()=>{
    const sd = document.getElementById('scene');
    sd.style.opacity = '0';
    sd.innerHTML = `
      <div class="ending-reveal" style="opacity:0;transition:opacity 0.6s ease;">
        <div class="ending-icon">${icon}</div>
        <div class="ending-title ${colorClass}">
          <span class="ink-wipe ${colorClass}">${label}</span>
        </div>
        <div class="ending-sub">— 끝 —</div>
      </div>`;
    document.getElementById('choices').innerHTML = '';
    sd.style.transition = 'opacity 0.5s';
 
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        sd.style.opacity = '1';
        const rev  = sd.querySelector('.ending-reveal');
        const ico  = sd.querySelector('.ending-icon');
        const wipe = sd.querySelector('.ink-wipe');
        const sub  = sd.querySelector('.ending-sub');
        rev.style.opacity = '1';
        setTimeout(()=>{ ico.classList.add('pop'); }, 100);
        setTimeout(()=>{ wipe.classList.add('run'); }, 420);
        setTimeout(()=>{ sub.classList.add('rise'); }, 1400);
        showRestartBtn(2400);
      });
    });
  }, 800);
}

      {text:"무시한다", delta:()=>`☠ ${rangeText(25)}`,                      effect:()=>{document.getElementById('scene6-image').classList.remove('visible');applyChange({corruption:25});},     next:scene7}
    ]
  });
}
 
function scene7(){
  /* 씬7 이미지 표시 */
  document.getElementById('scene7-image').classList.add('visible');

  renderScene({
    intro:{
      narration:'"이제 선택은 하나다."<br>"얼마를 얻을 것인가… 그리고 무엇을 잃을 것인가."',
      desc:null
    },
    dialogue: bubble('player','나','"…여기서 끝내야 한다."'),
    choices:[
      {text:"유지",delta:()=>`루프 +1`,   effect:()=>{document.getElementById('scene7-image').classList.remove('visible');state.Loop++;},             next:ending},
      {text:"해체",delta:()=>`노드 파괴`, effect:()=>{document.getElementById('scene7-image').classList.remove('visible');state.NodeDestroyed=true;}, next:ending}
    ]
  });
}
 
/* ── 엔딩 분기 ── */
function ending(){
  let type='';
  if(state.NodeDestroyed)                         type='void';
  else if(state.Corruption>=80)                   type='collapse';
  else if(state.SoulPurity>=70)                   type='salvation';
  else if(state.Wealth>=60&&state.Corruption>=40) type='tyrant';
  else if(state.Loop>=2)                          type='loop';
  else                                            type='node';
 
  if(type==='salvation'){ triggerSalvationEnding(); return; }
  if(type==='collapse'){  triggerCollapseEnding();  return; }
 
  const map={
    void:  {label:'공허 엔딩',  icon:'⚫'},
    tyrant:{label:'폭군 엔딩',  icon:'👑'},
    loop:  {label:'순환 엔딩',  icon:'🔁'},
    node:  {label:'자원화 엔딩',icon:'🪶'}
  };
  const e=map[type];
  showOtherEnding(e.label, e.icon);
}
 
updateUI();
</script>
